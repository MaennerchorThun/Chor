<style>
:root{color-scheme:light;
  --bg:#faf7f4;--surface:#ffffff;--surface2:#f3eee9;--text:#1f1b18;--muted:#6b625b;--line:#e6ddd5;
  --brand:#1f4e79;--brand-soft:#fde3e7;--brand-ink:#fff;--accent:#f2c230;--accent-soft:#fdf3cf;
  --ok:#2e7d4f;--ok-soft:#e1f1e7;--warn:#a65f00;--warn-soft:#fbecd6;--danger:#b3261e;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161311;--surface:#211c19;--surface2:#2a2420;--text:#f3ede8;--muted:#a89d94;--line:#3a322c;
  --brand:#ff4d63;--brand-soft:#3d1a20;--accent:#f2c230;--accent-soft:#3a3115;
  --ok:#5cc28a;--ok-soft:#1b3326;--warn:#f0a646;--warn-soft:#3a2a14;--danger:#ff7a70;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#161311;--surface:#211c19;--surface2:#2a2420;--text:#f3ede8;--muted:#a89d94;--line:#3a322c;
  --brand:#ff4d63;--brand-soft:#3d1a20;--accent:#f2c230;--accent-soft:#3a3115;
  --ok:#5cc28a;--ok-soft:#1b3326;--warn:#f0a646;--warn-soft:#3a2a14;--danger:#ff7a70;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.install{display:flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);font-size:13px;padding:8px 16px}.install[hidden]{display:none}.install span{flex:1}.install button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-weight:600;cursor:pointer}
.hdr-brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:40px;width:auto;flex:none;display:block}
.hero-logo{height:76px;width:auto;display:block;margin:0 0 10px}
.hdr-brand b{display:block;font-size:15px}.hdr-brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.role select{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 6px;font-size:13px}
.demo{background:var(--accent-soft);color:var(--text);font-size:12px;text-align:center;padding:4px 16px;border-bottom:1px solid var(--line)}
main{max-width:980px;margin:0 auto;padding:16px 16px 100px}
/* Nav */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);cursor:pointer;border-radius:10px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--brand);font-weight:600}
/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card.brand{background:var(--brand);color:#fff;border-color:transparent}
.card.brand .muted{color:rgba(255,255,255,.85)}
.card.soft{background:var(--surface2)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:84px}
.tile:hover{border-color:var(--brand)}
.tile .ic{font-size:20px;line-height:1}
.tile b{font-size:14px}.tile span{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card.brand .btn{background:#fff;color:var(--brand);border-color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.chip.b{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.chip.y{background:var(--accent-soft);border-color:transparent}
.chip.g{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.w{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.filter button{flex:none;cursor:pointer}
.filter button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea.input{min-height:90px;resize:vertical}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--muted)}
.av.e{background:var(--accent-soft);color:var(--text)}
.av.c{background:var(--brand-soft);color:var(--brand)}
.li .grow{flex:1;min-width:0}
.concert{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 80%,#000),var(--brand));color:#fff;border:0}.concert .btn{background:#fff;color:var(--brand);border-color:#fff}
.cdates{display:flex;flex-direction:column;gap:6px}.cdates div{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px}
.lyr{font-size:17px;line-height:1.6;margin:0}.lyr1{font-weight:600}
.sheet-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;overflow:auto}
.sheet-img{width:100%;height:auto;display:block}
.li .nm{font-weight:600}
.li .sub{font-size:12.5px;color:var(--muted)}
.li .rt{text-align:right;font-size:12.5px;color:var(--muted);flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:1.5rem;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:20px 0 10px}
.sec-h h2{margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;font-weight:700;color:var(--brand);margin:0 0 6px}
.hero{padding:8px 0 14px}
.hero h1{font-size:1.9rem}
/* Timeline */
.tl{position:relative;margin-left:6px}
.tl-part{margin:18px 0 8px;font-weight:800;font-size:.95rem;color:var(--brand)}
.tl-item{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl-item .tm{font-variant-numeric:tabular-nums;font-weight:700}
.tl-item.int{opacity:.8}
.tl-item.int .tm::after{content:" ·";color:var(--warn)}
.tl-item .who{font-size:12px;color:var(--muted)}
/* Saal */
.saal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.saal .ttile{padding:8px}
.saal .ttile b{font-size:13.5px}
.ttile.ehren{background:var(--accent-soft)}
.saal-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 12px}
.saal-sum b{color:var(--text)}
.stage{grid-column:1/-1;background:var(--text);color:var(--bg);border-radius:10px;text-align:center;padding:10px;font-weight:700;letter-spacing:.2em;font-size:12px}
.ttile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.ttile.front{grid-column:1/-1}
.ttile.mine{border-color:var(--brand)}
.ttile.sel{outline:3px solid var(--accent);outline-offset:1px}
.dots{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:8px}
.dots i{height:8px;border-radius:2px;background:var(--surface2);border:1px solid var(--line)}
.dots i.f{background:var(--ok);border-color:var(--ok)}
.dots i.e{background:var(--accent);border-color:var(--accent)}
.dots i.m{background:var(--brand);border-color:var(--brand)}
.tbl{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border:2px solid var(--text);border-radius:6px;overflow:hidden;background:var(--surface)}
.tbl .num{font-size:11px;font-weight:700;text-align:center;padding:3px 0;background:var(--surface2);border-right:1px solid var(--line)}
.tbl .seat{height:128px;border-right:1px solid var(--line);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface);padding:4px 0;overflow:hidden;position:relative}
.tbl .seat span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:118px}
.tbl .seat.f{background:var(--ok-soft);color:var(--ok)}
.tbl .seat.e{background:var(--accent-soft);color:var(--text)}
.tbl .seat.c span{font-weight:800}
.tbl .seat.me{box-shadow:inset 0 0 0 3px var(--brand)}
.tbl .seat.hl{animation:pulse 1s ease-in-out 3}
.tbl .seat.empty{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,var(--surface2) 6px,var(--surface2) 12px)}
.tbl .num:nth-child(8n),.tbl .seat:nth-child(8n){border-right:0}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--accent)}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
/* Wine */
.wine{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.wine:last-child{border-bottom:0}
.wine .nm{font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.qty b{min-width:18px;text-align:center}
.cart{position:sticky;bottom:70px;background:var(--text);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.cart .btn{background:var(--brand);border-color:var(--brand);color:#fff}
.order{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface)}
.st-neu{color:var(--brand)}.st-arbeit{color:var(--warn)}.st-serviert{color:var(--ok)}
/* Survey */
.rate{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stars{display:flex;gap:4px}
.stars button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.stars button.on{background:var(--accent);border-color:var(--accent);color:#1f1b18}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:12px}
.lock{text-align:center;padding:30px 16px}
.lock .big{font-size:40px}
code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:12.5px}
.ttl{font-weight:700}
/* Placebo-Lautstärkeregler */
.knob-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.knob{width:min(300px,82vw);height:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.knob:active{cursor:grabbing}
.knob:focus-visible{filter:drop-shadow(0 0 0 3px var(--accent))}
.knob .track{fill:none;stroke:var(--surface2);stroke-width:16;stroke-linecap:round}
.knob .fill{fill:none;stroke:var(--brand);stroke-width:16;stroke-linecap:round;transition:stroke-dasharray .08s}
.knob .tick{stroke:var(--muted);stroke-width:2}
.knob .tick.on{stroke:var(--brand);stroke-width:3}
.knob .lbl{font:700 13px system-ui,sans-serif;fill:var(--muted);text-anchor:middle;dominant-baseline:middle}
.knob .lbl.max{fill:var(--brand)}
.vol-val{font-size:64px;font-weight:900;line-height:1;margin-top:-6px;font-variant-numeric:tabular-nums;color:var(--brand)}
.vol-msg{font-size:17px;font-weight:700;text-align:center;min-height:48px;margin:8px 0 0;max-width:340px}
.vol-bars{display:flex;gap:4px;align-items:flex-end;height:34px;margin:12px 0}
.vol-bars i{width:10px;border-radius:3px;background:var(--surface2);transition:background .1s}
.vol-bars i.on{background:var(--brand)}
.vol-bars i.hot{background:var(--accent)}
.shake{animation:shake .35s linear infinite}
@keyframes shake{25%{transform:translate(1px,-1px) rotate(.4deg)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px) rotate(-.4deg)}}

/* Saal wie Tischplan 2025: Bühne links, 3 Spalten à 7 Tische (Tisch 1–7, 8–14, 15–21) */
.saal{grid-template-columns:24px repeat(3,minmax(0,1fr));grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:6px}
.saal .stage{grid-column:1;grid-row:1/span 7;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;padding:0;letter-spacing:.3em;font-size:11px;border-radius:8px}
.saal .ttile{padding:6px 7px;border-width:1.5px;border-radius:10px}
.saal .ttile b{font-size:12.5px}
.saal .ttile .small{font-size:11px}
.saal .dots{gap:2px;margin-top:5px}.saal .dots i{height:6px}
@media(min-width:700px){.saal{grid-template-columns:34px repeat(3,minmax(0,1fr));gap:8px}.saal .ttile{padding:8px 10px}}
/* Gruppenfarben */
:root{--g0b:#dcefe3;--g0f:#2b6a45;--g1b:#dde8f7;--g1f:#2b5a92;--g2b:#f7e5d2;--g2f:#8a4d10;--g3b:#ece0f4;--g3f:#6a3a88;--g4b:#d9f0ef;--g4f:#226b69;--gxb:#efeae5;--gxf:#6b625b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g0b:#1c3326;--g0f:#86d8a6;--g1b:#1c2a3e;--g1f:#93bcf2;--g2b:#3b2a17;--g2f:#f2b472;--g3b:#30223a;--g3f:#d2a6f0;--g4b:#163332;--g4f:#82d9d6;--gxb:#2a2420;--gxf:#a89d94}}
:root[data-theme="dark"]{--g0b:#1c3326;--g0f:#86d8a6;--g1b:#1c2a3e;--g1f:#93bcf2;--g2b:#3b2a17;--g2f:#f2b472;--g3b:#30223a;--g3f:#d2a6f0;--g4b:#163332;--g4f:#82d9d6;--gxb:#2a2420;--gxf:#a89d94}
.tbl .seat.g0{background:var(--g0b);color:var(--g0f)}.tbl .seat.g1{background:var(--g1b);color:var(--g1f)}.tbl .seat.g2{background:var(--g2b);color:var(--g2f)}.tbl .seat.g3{background:var(--g3b);color:var(--g3f)}.tbl .seat.g4{background:var(--g4b);color:var(--g4f)}.tbl .seat.gx{background:var(--gxb);color:var(--gxf)}
.dots i.g0{background:var(--g0f);border-color:var(--g0f)}.dots i.g1{background:var(--g1f);border-color:var(--g1f)}.dots i.g2{background:var(--g2f);border-color:var(--g2f)}.dots i.g3{background:var(--g3f);border-color:var(--g3f)}.dots i.g4{background:var(--g4f);border-color:var(--g4f)}.dots i.gx{background:var(--gxf);border-color:var(--gxf)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.sw.g0{background:var(--g0f)}.sw.g1{background:var(--g1f)}.sw.g2{background:var(--g2f)}.sw.g3{background:var(--g3f)}.sw.g4{background:var(--g4f)}.sw.gx{background:var(--gxf)}
.tbl .seat.dim{opacity:.35}
.tbl .seat.warn{box-shadow:inset 0 0 0 3px #e0a000}.tbl .seat.warn span::before{content:"⚠ "}

/* ---------- Präsenzkontrolle (Excel/CSV-Raster) importieren ---------- */
let PRX=null;
const prxIso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function prxParse(R){R=R.map(r=>(r||[]).map(v=>v==null?"":String(v).trim()));const lab=r=>prN(r[0]||"").replace(/[^a-z]/g,"");
  const ncol=Math.max(...R.map(r=>r.length));let dates=new Array(ncol).fill(null),hdr=-1;
  const iT=R.findIndex(r=>lab(r)==="tag"),iM=R.findIndex(r=>lab(r)==="monat"),iJ=R.findIndex(r=>lab(r)==="jahr");
  if(iT>=0&&iM>=0){for(let j=1;j<ncol;j++){const t=+R[iT][j],m=+R[iM][j];let y=iJ>=0?+R[iJ][j]:new Date().getFullYear();if(y&&y<100)y+=2000;
      if(t>=1&&t<=31&&m>=1&&m<=12&&y)dates[j]=`${y}-${pad(m)}-${pad(t)}`}hdr=Math.max(iT,iM,iJ)}
  else for(let i=0;i<Math.min(R.length,15);i++){const ds=R[i].map(v=>{let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;
      m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return`${y}-${pad(+m[2])}-${pad(+m[1])}`}return null});
    if(ds.filter(Boolean).length>=2){dates=ds;hdr=i;break}}
  const cols=dates.map((d,j)=>d?j:-1).filter(j=>j>0);if(!cols.length)return{err:"Keine Datumsspalten gefunden (Zeilen «Tag», «Monat», «Jahr» oder Datum in einer Kopfzeile)"};
  const mark=v=>{const x=String(v||"").trim().toLowerCase();if(!x)return null;if(["1","x","✓","✔","ja","j"].includes(x))return true;if(["0","nein","n","-"].includes(x))return false;return undefined};
  const rows=[];
  for(let i=hdr+1;i<R.length;i++){const r=R[i],n=r[0]||"";if(!n||/^(total|summe|anlass|tag|monat|jahr)$/i.test(n))continue;
    const v=cols.map(j=>mark(r[j]));if(v.some(x=>x===undefined)||!v.some(x=>x!==null))continue;
    const vn=r[1]&&!/^\d/.test(r[1])?r[1]:"";rows.push({name:n,vorname:vn,v})}
  if(!rows.length)return{err:"Keine Sänger-Zeilen mit 1/0 gefunden"};
  return{cols:cols.map(j=>dates[j]),rows}}
function prxMatch(P){const ppl=S.members.filter(m=>m.aktiv!==false),used=new Set();
  for(const r of P.rows){const tk=prT(r.name+" "+r.vorname);let b=null;for(const p of ppl){const x=prScore(tk,p);if(x&&x.sc>=.62&&(!b||x.sc>b.x.sc))b={p,x}}

    return{d,e,multi:es.length>1,future:e?D(e.start)>now:new Date(d)>now}});
  return P}

const yearOf=x=>x.created_at?new Date(x.created_at).getFullYear():null;
const STRANK=x=>{const my=S.me.stimme||"";return x.stimme===my?0:x.stimme&&(x.stimme==="Tenöre"||x.stimme==="Bässe")?1:x.stimme?2:3};
function plCandidates(){return S.files.filter(x=>x.art==="audio"&&(PL.scope==="alle"||isMine(x))&&(PL.year==="alle"||String(yearOf(x))===PL.year))
  .sort((a,b)=>(a.lied||"").localeCompare(b.lied||"")||STRANK(a)-STRANK(b)||a.titel.localeCompare(b.titel))}
function plAudio(){let a=document.getElementById("plaudio");if(a)return a;a=document.createElement("audio");a.id="plaudio";a.preload="auto";a.setAttribute("playsinline","");document.body.appendChild(a);
  a.addEventListener("ended",()=>{if(PL.rep==="one"){a.currentTime=0;a.play().catch(()=>{});return}plNext(true)});
  a.addEventListener("play",plBar);a.addEventListener("pause",plBar);
  a.addEventListener("timeupdate",()=>{if("mediaSession" in navigator&&a.duration&&isFinite(a.duration)){try{navigator.mediaSession.setPositionState({duration:a.duration,position:Math.min(a.currentTime,a.duration),playbackRate:1})}catch(e){}}});
  if("mediaSession" in navigator){const ms=navigator.mediaSession;
    ms.setActionHandler("play",()=>a.play());ms.setActionHandler("pause",()=>a.pause());
    ms.setActionHandler("previoustrack",()=>plPrev());ms.setActionHandler("nexttrack",()=>plNext(false));
    try{ms.setActionHandler("seekto",d=>{if(d.seekTime!=null)a.currentTime=d.seekTime})}catch(e){}
    try{ms.setActionHandler("seekbackward",d=>{a.currentTime=Math.max(0,a.currentTime-(d.seekOffset||10))})}catch(e){}
    try{ms.setActionHandler("seekforward",d=>{a.currentTime=Math.min(a.duration||1e9,a.currentTime+(d.seekOffset||10))})}catch(e){}}
  return a}
async function plPlay(i){const x=PL.list[i];if(!x)return;PL.i=i;const a=plAudio();

  if("mediaSession" in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:x.titel,artist:`${T.name}${x.stimme?" · "+x.stimme:""}`,album:x.lied||"Übungsaufnahmen",

  plBar();if(route()[0]==="player")render()}

const isMine=x=>{const my=S.me.stimme||"";return my==="Chorleitung"||!x.stimme||x.stimme===my||(x.stimme==="Tenöre"&&/Tenor/.test(my))||(x.stimme==="Bässe"&&/Bass/.test(my))};

const safeName=t=>String(t||"Datei").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim().slice(0,90);
async function urlsFor(list){const need=list.filter(x=>!S.urls[x.path]).map(x=>x.path);for(let i=0;i<need.length;i+=100){const r=await filesFn({action:"urls",paths:need.slice(i,i+100)});Object.assign(S.urls,r.urls)}}
function saveBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
let jszipP=null;const loadZip=()=>jszipP||(jszipP=new Promise((ok,no)=>{if(window.JSZip)return ok(window.JSZip);const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";sc.onload=()=>ok(window.JSZip);sc.onerror=()=>{jszipP=null;no(new Error("ZIP-Funktion konnte nicht geladen werden"))};document.head.appendChild(sc)}));
async function dlOne(x){toast("Download wird vorbereitet …");await urlsFor([x]);const r=await fetch(S.urls[x.path]);if(!r.ok)throw new Error("Download fehlgeschlagen ("+r.status+")");
  saveBlob(await r.blob(),`${safeName(x.titel)}.${extOf(x)}`)}
async function dlZip(list,name){if(!list.length)return toast("Keine Dateien");if(S.dlBusy)return toast("Download läuft bereits");S.dlBusy=true;
  try{const JSZip=await loadZip();await urlsFor(list);const zip=new JSZip();let k=0,used={};
    for(const x of list){k++;toast(`Lade ${k}/${list.length}: ${x.titel}`);const r=await fetch(S.urls[x.path]);if(!r.ok)throw new Error(`${x.titel}: Fehler ${r.status}`);
      let fn=`${safeName(x.lied||"Allgemein")}/${safeName(x.titel)}.${extOf(x)}`;if(used[fn])fn=fn.replace(/(\.[^.]+)$/,` (${++used[fn]})$1`);else used[fn]=1;zip.file(fn,await r.blob())}
    toast("ZIP wird erstellt …");saveBlob(await zip.generateAsync({type:"blob"}),name);toast(`${list.length} Dateien heruntergeladen`)}
  catch(e){toast(e.message)}finally{S.dlBusy=false}}

const baseName=name=>name.normalize("NFC").replace(/(\.(m4a|mp3|mp4|wav|pdf|mov))+$/i,"").trim();
const stimmeOf=name=>{const n=" "+baseName(name).toLowerCase()+" ";return/ (t1\+t2|tenöre|tenoere) /.test(n)?"Tenöre":/ (b1\+b2|bässe|baesse) /.test(n)?"Bässe":/ t1 /.test(n)?"1. Tenor":/ t2 /.test(n)?"2. Tenor":/ b1 /.test(n)?"1. Bass":/ b2 /.test(n)?"2. Bass":""};

async function doUpload(){const fl=[...($("#uf")?.files||[])];if(!fl.length)return toast("Bitte Dateien wählen");
  const lied=$("#ul").value.trim(),stimme=$("#us").value,titel=$("#ut").value.trim();let ok=0;
  let k=0;for(const f of fl){k++;if(f.size>50*1048576){toast(`${f.name}: grösser als 50 MB`);continue}
    try{toast(`Lade ${k}/${fl.length}: ${baseName(f.name)} …`);const art=artOf(f),mime=art==="audio"&&!/^audio/.test(f.type)?"audio/mp4":(f.type||"application/octet-stream");const u=await filesFn({action:"upload",filename:f.name});
      const r=await fetch(u.signedUrl,{method:"PUT",headers:{apikey:SUPA.key,"x-upsert":"false","Content-Type":mime,"cache-control":"max-age=3600"},body:f});if(!r.ok)throw new Error("Upload fehlgeschlagen ("+r.status+")");
      await rpc("chor_file_add",{p_code:S.code,p_titel:fl.length===1&&titel?titel:baseName(f.name),p_lied:lied||liedOf(f.name)||baseName(f.name),p_art:art,p_stimme:stimme||stimmeOf(f.name),p_path:u.path,p_mime:mime,p_size:f.size});ok++}

  closeModal();await load();render();if(ok)toast(`${ok} Datei${ok>1?"en":""} hochgeladen`)}

async function loadBlatt(id){const el=$("#blatt");if(!el)return;let b;
  try{b=await rpc("chor_probenblatt",{p_code:S.code,p_event:id})}catch(e){el.innerHTML=`<p class="muted">${esc(e.message)}</p>`;return}
  const e=b.event,ord=x=>{const i=STIMMEN.indexOf(x.stimme);return i<0?9:i};
  const st=b.stimmen.sort((a,c)=>ord(a)-ord(c)),tot=st.reduce((s,x)=>s+x.total,0),da=st.reduce((s,x)=>s+x.da,0);
  const lst=(arr,f)=>arr.length?`<ul class="blist">${arr.map(f).join("")}</ul>`:`<p class="small muted" style="margin:0">–</p>`;
  const nm=x=>`<b>${esc(x.name)}</b>${x.stimme?` <span class="muted">(${esc(x.stimme)})</span>`:""}`;
  el.innerHTML=`<p class="eyebrow">Probenblatt</p><h1 style="margin-bottom:2px">${esc(e.titel)}</h1><p class="muted" style="margin:0 0 12px">${fDate(e.start)} · ${fTime(e.start)} Uhr (Eintreffen ${fTime(arrive(e))})${e.ort?" · "+esc(e.ort):""}${b.prev?` · letzte Probe ${fDateY(b.prev)}`:""}</p>
    ${e.info?`<div class="card soft small" style="white-space:pre-wrap">${esc(e.info)}</div>`:""}
    <div class="card"><h3>Präsenz nach Stimmen</h3><table class="t"><tr><th>Stimme</th><th>dabei</th><th>%</th><th>ab</th><th>?</th><th>offen</th></tr>
      ${st.map(x=>`<tr><td>${esc(x.stimme)}</td><td><b>${x.da}</b> / ${x.total}</td><td>${Math.round(x.da/Math.max(1,x.total)*100)}</td><td>${x.ab}</td><td>${x.vielleicht}</td><td>${x.offen}</td></tr>`).join("")}
      <tr><td><b>Total</b></td><td><b>${da}</b> / ${tot}</td><td><b>${Math.round(da/Math.max(1,tot)*100)}</b></td><td>${st.reduce((s,x)=>s+x.ab,0)}</td><td>${st.reduce((s,x)=>s+x.vielleicht,0)}</td><td>${st.reduce((s,x)=>s+x.offen,0)}</td></tr></table>

        ${b.absagen.length?`<p class="small" style="margin:8px 0 2px"><b>Abgemeldet für diese Probe:</b></p>${lst(b.absagen,x=>`<li>${nm(x)}${x.grund?` – ${esc(x.grund)}`:""}</li>`)}`:""}</div>

function parseBulk(txt){const out=[],seen=new Set();for(let line of String(txt).split(/\r?\n/)){line=line.replace(/^[\s➢>•\-–*]+/,"").trim();if(!line)continue;

    if(yi>0){const m=parts[yi].match(/^(\d{4})(?:\s*[-–]\s*(\d{4})?)?/);von=+m[1];bis=m[2]?+m[2]:(/[-–]/.test(parts[yi])?null:+m[1]);if(/heute|offen/i.test(parts[yi]))bis=null;parts.splice(yi,1)}

function csvRows(t){t=t.replace(/^﻿/,"");const first=t.split(/\r?\n/)[0]||"",sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":first.includes("\t")?"\t":",";

    else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=c}

  if(m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){let y=+m[3];if(y<100)y+=y>30?1900:2000;return`${y}-${pad(m[1])}-${pad(m[2])}`}
  if(m=v.match(/^(\d{1,2})[-. ]([A-Za-zÄÖÜäöü]{3,})\.?[-. ](\d{2,4})$/)){const mo={jan:1,feb:2,mär:3,mrz:3,mar:3,apr:4,mai:5,may:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dez:12,dec:12}[m[2].toLowerCase().slice(0,3)];

  if(el.dataset.chg==="plsel"){if(!PL.sel)PL.sel=new Set();if(el.checked)PL.sel.add(el.dataset.id);else PL.sel.delete(el.dataset.id);plSave();const b=document.querySelector('[data-act="plstart"]');if(b)b.textContent=`▶ ${plCandidates().filter(x=>PL.sel.has(x.id)).length} Aufnahmen abspielen`;return}
  if(el.dataset.chg==="plyear"){PL.year=el.value;PL.sel=null;plSave();render();return}
  if(el.dataset.chg==="plscope"){PL.scope=el.value;PL.sel=null;plSave();render();return}
  if(el.id==="kxfile"&&el.files[0]){kxRead(el.files[0]);el.value=""}
  if(el.id==="prxfile"&&el.files[0]){prxRead(el.files[0]);el.value=""}
  if(el.id==="spfile"&&el.files[0]){const r=new FileReader();r.onload=()=>doSpImport(String(r.result));r.readAsText(el.files[0],"utf-8")}
  if(el.id==="impfile"&&el.files[0]){const f=el.files[0];if(/\.xlsx?$/i.test(f.name)){readXlsx(f).then(doImport).catch(e=>toast(e.message))}else{const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f,"utf-8")}}
  if(el.dataset.chg==="sjahr"){S.statJahr=+el.value;render()}
  if(el.dataset.chg==="noten"){const on=el.checked;rpc("chor_set_noten",{p_code:S.code,p_person:el.dataset.id,p_on:on}).then(async()=>{await load();render();toast(on?"Noten-Berechtigung erteilt":"Noten-Berechtigung entfernt")}).catch(err=>{el.checked=!on;toast(err.message)})}
  if(el.dataset.chg==="ahnen"&&el.value){go("ahnen/"+encodeURIComponent(el.value))}
  if(el.dataset.chg==="ehrjahr"){S.ehrJahr=+el.value;render()}
  if(el.dataset.chg==="eindat"){S.einDat=el.value||null;render()}
  if(el.dataset.chg==="styp"){S.statTyp=el.value;render()}
  if(el.dataset.chg==="setfor"){rpc("chor_set_attendance",{p_code:S.code,p_event:el.dataset.ev,p_status:el.value||null,p_grund:null,p_person:el.dataset.id}).then(async()=>{await load();toast("Gespeichert")}).catch(err=>toast(err.message))}
});
window.addEventListener("hashchange",()=>{if(S.me){S.play=null;render();scrollTo(0,0)}});
/* ===== Versionsprüfung: meldet, wenn auf dem Server eine neuere Version liegt (z.B. nach Upload auf GitHub) ===== */
function versionCheck(){const url=location.pathname+(location.pathname.endsWith("/")?"index.html":"")+"?v="+Date.now();
  fetch(url,{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{const m=t.match(/const APP_VERSION="(\d[^"]*)"/);if(!m||m[1]===APP_VERSION||document.getElementById("vbar"))return;
    const d=document.createElement("div");d.id="vbar";d.style.cssText="position:fixed;left:12px;right:12px;bottom:76px;z-index:70;background:#1f1b18;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.25);font-size:14px";
    d.innerHTML=`<span style="flex:1">Neue Version ${m[1]} verfügbar (du hast ${APP_VERSION}).</span><button style="background:#de1034;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer">Neu laden</button>`;
    d.querySelector("button").onclick=()=>{try{caches&&caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}catch(e){}const u=new URL(location.href);u.searchParams.set("v",m[1]);location.replace(u.toString())};document.body.appendChild(d)}).catch(()=>{})}
setTimeout(versionCheck,2500);setInterval(()=>{if(!document.hidden)versionCheck()},10*60*1000);
/* ===================== Gremien: Vorstand, MUKO, Obmannschaft – Sitzungen, Traktanden, Beschlüsse, Dokumente ===================== */
const GR_LBL={vorstand:"Vorstandssitzung",muko:"MUKO-Sitzung",obmannschaft:"Obmannschaftssitzung"};
const GR_ST={geplant:"geplant",eingeladen:"eingeladen",durchgefuehrt:"durchgeführt",abgesagt:"abgesagt"};
const BS_ST={offen:"offen",erledigt:"erledigt",info:"zur Kenntnis"};
S.gd=S.gd||{};
async function grLoad(g,force){if(S.gd[g]&&!force)return S.gd[g];S.gd[g]=await rpc("gremium_data",{p_code:S.code,p_g:g});return S.gd[g]}
/* Männerchor: Vorstand und MUKO · Veteranen: Obmannschaft */
const grVis=()=>(S.gremien||[]).filter(x=>isVet()?x.g==="obmannschaft":x.g!=="obmannschaft");
async function grList(){try{S.gremien=await rpc("gremium_list",{p_code:S.code})}catch(e){S.gremien=[]}}
const grTitle=(g,x)=>x.titel||`${GR_LBL[g]}${x.nr?" "+x.nr:""}`;
const grDate=x=>D(x).toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const grNum=(t,i,j)=>j==null?`${i+1}.`:`${i+1}.${j+1}.`;
function grTrakt(list){return`<ol style="margin:0;padding-left:0;list-style:none">${(list||[]).map((t,i)=>`<li style="margin:0 0 6px"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><span><b>${grNum(t,i)}</b> ${esc(t.t||"")}</span>${t.v?`<span class="small muted" style="flex:none;margin-left:8px">${esc(t.v)}</span>`:""}</div>${(t.u||[]).length?`<div class="small" style="padding-left:22px">${t.u.map((u,j)=>`<div>${grNum(t,i,j)} ${esc(u)}</div>`).join("")}</div>`:""}</li>`).join("")}</ol>`}
/* Editor für Traktandenlisten (Sitzung und Vorlage) */
function grEditor(list){S.trEdit=JSON.parse(JSON.stringify(list||[]));return`<div id="tred">${grEditorRows()}</div><button class="btn sm" data-act="tradd" style="margin-top:6px">+ Traktandum</button>`}
function grEditorRows(){return S.trEdit.map((t,i)=>`<div class="card" style="padding:8px 10px;margin:0 0 6px"><div class="row" style="flex-wrap:nowrap;gap:6px"><b style="flex:none;width:22px">${i+1}.</b>
  <input class="input" data-tr="t" data-i="${i}" value="${esc(t.t||"")}" placeholder="Traktandum" style="flex:1"><input class="input" data-tr="v" data-i="${i}" value="${esc(t.v||"")}" placeholder="wer" style="width:90px;flex:none"></div>
  <textarea class="input small" data-tr="u" data-i="${i}" rows="${Math.max(1,(t.u||[]).length)}" placeholder="Unterpunkte (eine Zeile pro Punkt, Verantwortliche mit «| DH»)" style="margin-top:4px">${esc((t.u||[]).join("\n"))}</textarea>
  <div class="row small" style="gap:4px;margin-top:4px"><button class="btn sm ghost" data-act="trmv" data-i="${i}" data-d="-1">↑</button><button class="btn sm ghost" data-act="trmv" data-i="${i}" data-d="1">↓</button><button class="btn sm ghost" data-act="trdel" data-i="${i}">✕ entfernen</button></div></div>`).join("")}
function grTrRead(){document.querySelectorAll("[data-tr]").forEach(el=>{const t=S.trEdit[+el.dataset.i];if(!t)return;const k=el.dataset.tr;if(k==="u")t.u=el.value.split("\n").map(x=>x.trim()).filter(Boolean);else t[k]=el.value.trim()});return S.trEdit.filter(t=>t.t)}

function vGremien(){if(!S.gremien){grList().then(render);return`<p class="muted">wird geladen …</p>`}
  if(!grVis().length)return`<button class="btn ghost sm" data-act="go" data-r="mehr" style="margin-bottom:10px">← Mehr</button><h1>Gremien</h1><p class="muted">Dieser Bereich ist für ${isVet()?"die Obmannschaft":"Vorstand und MUKO"}.</p>`;
  return`<button class="btn ghost sm" data-act="go" data-r="mehr" style="margin-bottom:10px">← Mehr</button><h1>Gremien</h1><p class="muted small">Sitzungen, Traktanden, Beschlüsse und Dokumente. Sichtbar nur für die Mitglieder des jeweiligen Gremiums (gemäss «Vorstand & Chargen»).</p>
  ${grVis().map(x=>`<button class="card" data-act="go" data-r="gremium/${x.g}" style="display:block;width:100%;text-align:left;cursor:pointer"><div class="row between"><b>${esc(x.name)}</b><span class="muted">›</span></div>
    <div class="small muted">${x.next?`Nächste Sitzung: ${grDate(x.next)}, ${fTime(x.next)} Uhr`:"keine Sitzung geplant"}${x.offen?` · ${x.offen} offene Beschlüsse`:""}</div></button>`).join("")}`}

function vGremium(g){if(S.gremien&&!grVis().some(x=>x.g===g)){setTimeout(()=>go("gremien"),0);return""}const d=S.gd[g];if(!d){grLoad(g).then(render).catch(e=>{toast(e.message);go("gremien")});return`<p class="muted">wird geladen …</p>`}
  const tab=S.grTab||"sitzungen",st=d.settings||{},now=new Date();
  const tb=(k,l)=>`<button class="chip ${tab===k?"on":""}" data-act="grtab" data-k="${k}">${l}</button>`;
  let h=`<button class="btn ghost sm" data-act="go" data-r="gremien" style="margin-bottom:10px">← Gremien</button><h1 style="margin:0 0 6px">${esc(st.name||g)}</h1>
  <div class="filter">${tb("sitzungen","Sitzungen")}${tb("beschluesse",`Beschlüsse${d.beschluesse.filter(b=>b.status==="offen").length?" ("+d.beschluesse.filter(b=>b.status==="offen").length+")":""}`)}${tb("dokumente","Dokumente")}${tb("mitglieder","Mitglieder")}${tb("vorlage","Vorlage & Einstellungen")}</div>`;
  if(tab==="sitzungen"){const fut=d.sitzungen.filter(x=>D(x.start)>=new Date(now-864e5)),past=d.sitzungen.filter(x=>D(x.start)<new Date(now-864e5)).reverse();
    const row=x=>`<button class="li" data-act="go" data-r="gsitz/${g}/${x.id}"><div class="av">${D(x.start).getDate()}</div><div class="grow"><div class="nm">${esc(grTitle(g,x))}</div><div class="sub">${grDate(x.start)}, ${fTime(x.start)} Uhr${x.ort?" · "+esc(x.ort.split(",")[0]):""}</div></div><span class="chip ${x.status==="abgesagt"?"w":x.status==="durchgefuehrt"?"":"g"}">${GR_ST[x.status]}</span></button>`;
    h+=`<div class="row between" style="margin:8px 0"><h3 style="margin:0">Kommende Sitzungen</h3><button class="btn sm primary" data-act="grnew" data-g="${g}">+ Sitzung</button></div><div class="card"><div class="list">${fut.map(row).join("")||`<p class="muted small">Keine geplant.</p>`}</div></div>
      ${past.length?`<details class="card"><summary style="cursor:pointer;font-weight:700">Vergangene Sitzungen (${past.length})</summary><div class="list">${past.map(row).join("")}</div></details>`:""}
      <p class="small muted">Die Sitzungen erscheinen auch im persönlichen Kalender-Abo (Mehr → Kalender-Abo) der Gremiumsmitglieder.</p>`}
  if(tab==="beschluesse"){const f=S.bsF||"offen",ls=d.beschluesse.filter(b=>f==="alle"||b.status===f);
    h+=`<div class="row between" style="margin:8px 0;flex-wrap:wrap;gap:6px"><div class="filter" style="margin:0">${["offen","erledigt","info","alle"].map(k=>`<button class="chip ${f===k?"on":""}" data-act="bsf" data-k="${k}">${k==="alle"?"alle":BS_ST[k]}</button>`).join("")}</div><div class="row">${PBTN}<button class="btn sm primary" data-act="bsedit" data-g="${g}">+ Beschluss</button></div></div>
      <div class="card">${ls.length?`<table class="t"><tr><th>Datum</th><th>Beschluss</th><th>Wer</th><th>Termin</th><th></th></tr>${ls.map(b=>`<tr><td style="white-space:nowrap">${fDateY(b.datum)}</td><td>${b.traktandum?`<span class="small muted">${esc(b.traktandum)}</span><br>`:""}${esc(b.text)}</td><td>${esc(b.verantwortlich||"")}</td><td style="white-space:nowrap">${b.termin?fDateY(b.termin):""}</td><td><button class="btn sm ghost noprint" data-act="bsedit" data-g="${g}" data-id="${b.id}">✎</button>${b.status==="offen"?` <button class="btn sm noprint" data-act="bsdone" data-g="${g}" data-id="${b.id}" title="als erledigt markieren">✓</button>`:""}</td></tr>`).join("")}</table>`:`<p class="muted small">Keine Beschlüsse.</p>`}</div>`}
  if(tab==="dokumente")h+=grDocs(g,null);
  if(tab==="mitglieder")h+=`<div class="card"><table class="t">${d.mitglieder.map(m=>`<tr><td>${esc(m.vorname)} ${esc(m.name)}</td><td>${esc(m.funktion)}</td><td>${m.gast?`<span class="chip">Gast</span>`:""}</td></tr>`).join("")}</table>
    <p class="small muted" style="margin:8px 0 0">Die Zusammensetzung kommt aus «Vorstand & Chargen» (aktuelle Einträge${g==="vorstand"?"; Gäste = Häkchen «V+»":g==="muko"?"; Häkchen «MUKO»":""}).</p></div>`;
  if(tab==="vorlage")h+=`<div class="card" style="display:grid;gap:6px"><b>Standard für neue Sitzungen</b>
      <label class="small muted">Ort</label><input id="gsort" class="input" value="${esc(st.ort||"")}"><label class="small muted">Zeit</label><input id="gszeit" class="input" type="time" value="${esc(st.zeit||"")}">
      <label class="small muted">OneDrive-Link zur Datenablage (Freigabe-Link «https://…»)</label><input id="gsod" class="input" value="${esc(st.onedrive_url||"")}" placeholder="https://…sharepoint.com/…">
      <p class="small muted" style="margin:0">So kommst du zum Link: im Explorer bzw. auf onedrive.com den Ordner (z.B. «Datenablage Vorstand») rechts anklicken → «Link kopieren» bzw. «Teilen» → «Personen mit dem Link» → Link kopieren und hier einfügen.</p>
      <b style="margin-top:8px">Absender auf der Einladung</b>${(()=>{const a=grAbs(g,d);return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="gsaf" class="input" value="${esc(a.funktion)}" placeholder="Funktion"><input id="gsan" class="input" value="${esc(a.name)}" placeholder="Name"></div>
      <textarea id="gsaa" class="input" rows="2" placeholder="Adresse (Strasse, PLZ Ort)">${esc(a.adresse)}</textarea>
      <div style="display:grid;grid-template-columns:110px 1fr 1fr;gap:6px"><input id="gsatl" class="input" value="${esc(a.tel_lbl)}" placeholder="Mobile"><input id="gsat" class="input" value="${esc(a.tel)}" placeholder="Telefonnummer"><input id="gsao" class="input" value="${esc(a.ort)}" placeholder="Ort für Datum, z.B. 3600 Thun"></div>`})()}
      <b style="margin-top:8px">Standard-Traktandenliste</b>${grEditor(st.traktanden)}
      <button class="btn primary" data-act="gssave" data-g="${g}" style="margin-top:8px">Speichern</button></div>`;
  return h}

function grDocs(g,sid){const d=S.gd[g],st=d.settings||{},ls=d.dokumente.filter(x=>sid?x.sitzung_id===sid:true),sz=x=>x.groesse?fSize(x.groesse):"";
  return`<div class="card">${st.onedrive_url?`<a class="btn" href="${esc(st.onedrive_url)}" target="_blank" rel="noopener" style="width:100%;margin-bottom:8px">📁 Datenablage auf OneDrive öffnen</a>`:sid?"":`<p class="small muted">Tipp: Unter «Vorlage & Einstellungen» den OneDrive-Link zur Datenablage hinterlegen.</p>`}
    <div class="row" style="flex-wrap:wrap;gap:6px"><input type="file" id="gdfile" class="input" multiple style="flex:1;min-width:200px"><button class="btn sm primary" data-act="gdup" data-g="${g}" data-s="${sid||""}">Hochladen</button></div>
    <div class="list" style="margin-top:8px">${ls.map(x=>`<div class="li" style="cursor:default"><div class="av">📄</div><div class="grow"><div class="nm">${esc(x.titel)}</div><div class="sub">${fDateY(x.created_at)}${sz(x)?" · "+sz(x):""}${!sid&&x.sitzung_id?` · ${esc(grTitle(g,d.sitzungen.find(s=>s.id===x.sitzung_id)||{}))}`:""}</div></div>
      <button class="btn sm" data-act="gdopen" data-id="${x.id}">Öffnen</button><button class="btn sm ghost" data-act="gddel" data-g="${g}" data-id="${x.id}" aria-label="löschen">✕</button></div>`).join("")||`<p class="muted small">Noch keine Dokumente.</p>`}</div></div>`}

function vGSitz(g,id){const d=S.gd[g];if(!d){grLoad(g).then(render);return`<p class="muted">wird geladen …</p>`}
  const x=d.sitzungen.find(s=>s.id===id);if(!x)return`<p class="muted">Sitzung nicht gefunden.</p>`;
  const bs=d.beschluesse.filter(b=>b.sitzung_id===id),gst=d.mitglieder.filter(m=>m.gast),tm=d.mitglieder.filter(m=>!m.gast);
  return`<button class="btn ghost sm" data-act="go" data-r="gremium/${g}" style="margin-bottom:10px">← ${esc(d.settings.name)}</button>
  <h1 style="margin:0 0 4px">${esc(grTitle(g,x))}</h1><p class="muted" style="margin:0 0 10px">${grDate(x.start)}, ${fTime(x.start)} Uhr${x.ort?" · "+esc(x.ort):""}</p>
  <div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:10px"><button class="btn sm primary" data-act="go" data-r="gein/${g}/${id}">📄 Einladung / Traktandenliste</button><button class="btn sm" data-act="go" data-r="gprot/${g}/${id}">📝 Protokoll</button>${isV()?`<button class="btn sm" data-act="grmail" data-g="${g}" data-id="${id}">✉️ Einladung mailen</button>`:""}<button class="btn sm ghost" data-act="grsedit" data-g="${g}" data-id="${id}">Termin bearbeiten</button></div>
  <div class="card"><div class="row between"><h3 style="margin:0 0 6px">Traktanden</h3><select class="input" data-chg="grstatus" data-g="${g}" data-id="${id}" style="width:auto">${Object.entries(GR_ST).map(([k,l])=>`<option value="${k}" ${x.status===k?"selected":""}>${l}</option>`).join("")}</select></div>
    ${grEditor(x.traktanden)}<button class="btn primary" data-act="grtsave" data-g="${g}" data-id="${id}" style="margin-top:8px">Traktanden speichern</button></div>
  <div class="card"><h3 style="margin:0 0 6px">Notizen / Protokoll</h3><textarea id="gprot" class="input" style="min-height:180px" placeholder="Notizen zu den Traktanden, Protokoll …">${esc(x.protokoll||"")}</textarea><button class="btn sm primary" data-act="grpsave" data-g="${g}" data-id="${id}" style="margin-top:6px">Speichern</button></div>
  <div class="card"><div class="row between"><h3 style="margin:0">Beschlüsse dieser Sitzung</h3><button class="btn sm" data-act="bsedit" data-g="${g}" data-s="${id}">+ Beschluss</button></div>
    ${bs.length?bs.map(b=>`<div class="li" style="cursor:default"><div class="grow"><div class="nm">${esc(b.text)}</div><div class="sub">${b.traktandum?esc(b.traktandum)+" · ":""}${esc(b.verantwortlich||"")}${b.termin?" · bis "+fDateY(b.termin):""} · ${BS_ST[b.status]}</div></div><button class="btn sm ghost" data-act="bsedit" data-g="${g}" data-id="${b.id}">✎</button></div>`).join(""):`<p class="small muted">Noch keine.</p>`}</div>
  <h3>Dokumente zur Sitzung</h3>${grDocs(g,id)}
  <div class="card soft small"><b>Teilnehmer:</b> ${tm.map(m=>esc(m.vorname+" "+m.name)).join(", ")}${gst.length?`<br><b>Gäste:</b> ${gst.map(m=>esc(m.vorname+" "+m.name)).join(", ")}`:""}</div>
  <button class="btn ghost sm" data-act="grsdel" data-g="${g}" data-id="${id}">Sitzung löschen</button>`}

/* Druckansicht: Einladung mit Traktandenliste (wie bisherige Vorlage) bzw. Protokoll */
function vGDoc(kind,g,id){const d=S.gd[g];if(!d){grLoad(g).then(render);return`<p class="muted">wird geladen …</p>`}
  const x=d.sitzungen.find(s=>s.id===id);if(!x)return`<p class="muted">Sitzung nicht gefunden.</p>`;
  const tm=d.mitglieder.filter(m=>!m.gast),gst=d.mitglieder.filter(m=>m.gast),bs=d.beschluesse.filter(b=>b.sitzung_id===id);
  const tr=l=>`<table class="t" style="border:0">${l.map(m=>`<tr><td style="width:40%">${esc(m.vorname)} ${esc(m.name)}</td><td>${esc(m.funktion)}</td></tr>`).join("")}</table>`;
  const head=`<div class="noprint row between" style="margin-bottom:10px"><button class="btn ghost sm" data-act="go" data-r="gsitz/${g}/${id}">← Sitzung</button>${PBTN}</div>`;
  if(kind==="gein")return vGEin(g,x,d);
  return head+`<p class="eyebrow">${esc(d.settings.name)} · ${esc(T.name)}</p><h1>Protokoll ${esc(grTitle(g,x))}</h1>
  <div class="card"><table class="t" style="border:0"><tr><td style="width:120px"><b>Datum</b></td><td>${grDate(x.start)}, ${fTime(x.start)} Uhr</td></tr><tr><td><b>Ort</b></td><td>${esc(x.ort||"")}</td></tr></table></div>
  <div class="card"><b style="display:block;margin-bottom:6px">Traktanden</b>${grTrakt(x.traktanden)}</div>
  <div class="card"><b>Protokoll</b><div style="white-space:pre-wrap;margin-top:6px">${esc(x.protokoll||"–")}</div></div>
  ${bs.length?`<div class="card"><b>Beschlüsse</b><table class="t">${bs.map(b=>`<tr><td>${b.traktandum?`<span class="small muted">${esc(b.traktandum)}</span><br>`:""}${esc(b.text)}</td><td>${esc(b.verantwortlich||"")}</td><td>${b.termin?fDateY(b.termin):""}</td></tr>`).join("")}</table></div>`:""}`}

/* Einladung im Layout der bisherigen Word-Vorlage (Briefkopf, Tabelle, Fusszeile) */
const GR_KURZ={vorstand:"VS",muko:"MUKO",obmannschaft:"OBM"},GR_TN={vorstand:"Vorstand",muko:"MUKO",obmannschaft:"Obmannschaft"},GR_ABS={vorstand:"Präsident",muko:"Präsident",obmannschaft:"Obmann"};
const grRank=f=>{f=(f||"").toLowerCase();return /^präsident/.test(f)?0:/^vize-?präs/.test(f)?1:/^obmann/.test(f)?0:/beisitz/.test(f)?8:/chorleit|dirig/.test(f)&&!/vize/.test(f)?6:/vize/.test(f)?7:5};
const grKz=m=>((m.vorname||"")[0]||"")+((m.name||"")[0]||"");
function grAbs(g,d){const a=(d.settings||{}).absender||{},f=a.funktion||GR_ABS[g];const m=(d.mitglieder||[]).find(x=>(x.funktion||"").toLowerCase()===f.toLowerCase());
  return{funktion:f,name:a.name||(m?m.vorname+" "+m.name:""),adresse:a.adresse||"",tel_lbl:a.tel_lbl||"Mobile",tel:a.tel||"",ort:a.ort||"3600 Thun"}}
function grEinName(g,x){const dt=S.einDat?new Date(S.einDat+"T12:00"):new Date(),p=n=>String(n).padStart(2,"0");
  const nr=(x.nr||"").replace(/\/(\d{2})?(\d{2})$/,"-$2");return`${p(dt.getDate())}${p(dt.getMonth()+1)}${String(dt.getFullYear()).slice(2)} Einladung ${esc(T.kurz||"")} ${GR_KURZ[g]||""}${nr?" "+nr:""}`.trim()}
function grSplitU(u){const m=String(u).match(/^(.*?)\s*\|\s*(.+)$/);return m?[m[1],m[2]]:[u,""]}
function vGEin(g,x,d){const a=grAbs(g,d),srt=l=>[...l].sort((p,q)=>grRank(p.funktion)-grRank(q.funktion));
  const tm=srt(d.mitglieder.filter(m=>!m.gast)),gst=srt(d.mitglieder.filter(m=>m.gast)),dt=S.einDat?new Date(S.einDat+"T12:00"):new Date();
  const ppl=l=>`<td><table>${l.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.vorname)}</td><td>${esc(grKz(m))}</td></tr>`).join("")}</table></td><td style="width:26%"><table>${l.map(m=>`<tr><td>${esc(m.funktion||"")}</td></tr>`).join("")}</table></td>`;

  const adr=a.adresse.split("\n").map(z=>z.trim()).filter(Boolean);
  const ein=grEinName(g,x),stn=`${esc(a.funktion)}<br>${esc(a.name)}`;
  return`<div class="noprint" style="margin-bottom:10px"><div class="row between" style="flex-wrap:wrap;gap:6px"><button class="btn ghost sm" data-act="go" data-r="gsitz/${g}/${x.id}">← Sitzung</button><button class="btn sm primary" data-act="printbrief" data-n="${esc(ein)}">🖨 PDF / Drucken</button></div>

    ${a.adresse||a.tel?"":`<span class="small muted">Absender-Adresse unter «Vorlage &amp; Einstellungen» ergänzen.</span>`}</div></div>
  <h1 style="position:absolute;left:-9999px">Einladung zur ${esc(grTitle(g,x))}</h1>
  <div class="brief" id="brief" data-foot="${esc(JSON.stringify([T.name+"\n"+a.funktion+"\n"+a.name,ein]))}">
   <div class="bh"><div class="bl"><img src="${LOGO}" alt=""><div class="bn">${esc(T.name)}</div></div>
    <table class="ba"><tr><td>${esc(a.funktion)}</td><td>${esc(a.name)}</td></tr>${adr.length?`<tr><td></td><td style="padding-top:6px">${adr.map(esc).join("<br>")}</td></tr>`:""}${a.tel?`<tr><td>${esc(a.tel_lbl)}</td><td>${esc(a.tel)}</td></tr>`:""}</table></div>
   <div class="bd">${esc(a.ort)}, ${dt.getDate()}.${dt.getMonth()+1}.${dt.getFullYear()}</div>
   <table class="bt"><tbody>
    <tr><th>Einladung zur</th><td colspan="2"><b>${esc(grTitle(g,x))}</b></td></tr>
    <tr><th>Termin, Zeit</th><td colspan="2">${grDate(x.start)}, ${fTime(x.start)} Uhr${x.ende?" – "+fTime(x.ende)+" Uhr":""}</td></tr>
    <tr><th>Ort</th><td colspan="2">${esc(x.ort||"")}</td></tr>

    <tr><th>Traktanden</th><td colspan="2">${tk}</td></tr>
   </tbody></table>

function printBrief(name){const b=$("#brief");if(!b)return;let root=$("#printroot");if(!root){root=document.createElement("div");root.id="printroot";document.body.appendChild(root)}
  const mb=typeof CSSMarginRule!=="undefined",[l,c]=JSON.parse(b.dataset.foot||'["",""]'),q=t=>'"'+String(t).replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g,"\\A ")+'"';
  root.innerHTML=b.outerHTML.replace('class="brief"',`class="brief${mb?" mb":""}"`).replace('id="brief"','');
  const st=document.createElement("style");st.id="prpage";
  st.textContent=mb?`@page{size:A4;margin:14mm 16mm 22mm 20mm;@bottom-left{content:${q(l)};white-space:pre;font:8.5pt Arial,sans-serif;vertical-align:top;padding-top:4mm}@bottom-center{content:${q(c)};font:8.5pt Arial,sans-serif;vertical-align:top;padding-top:4mm}@bottom-right{content:counter(page);font:8.5pt Arial,sans-serif;vertical-align:top;padding-top:4mm}}`:`@page{size:A4;margin:14mm 16mm 14mm 20mm}`;
  document.head.appendChild(st);const prev=document.title;document.title=name||"Einladung";
  const done=()=>{document.title=prev;st.remove();window.removeEventListener("afterprint",done)};window.addEventListener("afterprint",done);setTimeout(()=>window.print(),50)}

/* PDF der Einladung im Browser erzeugen (html2canvas + jsPDF), Fusszeile als Text */
let pdfLibP=null;const loadPdfLib=()=>pdfLibP||(pdfLibP=Promise.all(["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"].map(src=>new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=src;sc.onload=ok;sc.onerror=()=>no(new Error("PDF-Funktion konnte nicht geladen werden"));document.head.appendChild(sc)}))).catch(e=>{pdfLibP=null;throw e}));
const blobB64=b=>new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=()=>no(new Error("PDF konnte nicht gelesen werden"));fr.readAsDataURL(b)});
async function grEinPdf(g,x){await loadPdfLib();const tmp=document.createElement("div");tmp.innerHTML=vGEin(g,x,S.gd[g]);const br=tmp.querySelector(".brief");
  const [fl,fc]=JSON.parse(br.dataset.foot||'["",""]');br.querySelector(".bf")?.remove();br.removeAttribute("id");
  const wrap=document.createElement("div");wrap.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff";
  br.style.cssText="border:0;border-radius:0;max-width:none;width:794px;box-sizing:border-box;padding:0 60px 0 76px;overflow:visible;margin:0";
  wrap.appendChild(br);document.body.appendChild(wrap);
  try{const img=br.querySelector("img");if(img&&!img.complete)await new Promise(r=>{img.onload=img.onerror=r});
    const cv=await window.html2canvas(br,{scale:2,backgroundColor:"#ffffff",logging:false});
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true}),top=14,bot=22,pxmm=cv.width/210,pagePx=Math.floor((297-top-bot)*pxmm);
    /* Seitenumbruch nicht mitten in eine Zeile: an Zeilengrenzen der Tabellen ausrichten */
    const bTop=br.getBoundingClientRect().top,cuts=[...br.querySelectorAll("tr")].map(r=>Math.round((r.getBoundingClientRect().bottom-bTop)*2));
    let y=0,pg=0;while(y<cv.height-2){let h=Math.min(pagePx,cv.height-y);if(y+h<cv.height){const c=cuts.filter(c=>c>y+pagePx*0.5&&c<=y+pagePx).pop();if(c)h=c-y}
      if(pg)pdf.addPage();const pc=document.createElement("canvas");pc.width=cv.width;pc.height=h;const cx=pc.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,pc.width,h);cx.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      pdf.addImage(pc.toDataURL("image/jpeg",0.9),"JPEG",0,top,210,h/pxmm);pg++;
      const fy=297-bot+7,ls=fl.split("\n");pdf.setFontSize(8);pdf.setFont("helvetica","bold");pdf.text(ls[0]||"",20,fy);pdf.setFont("helvetica","normal");pdf.text(ls.slice(1),20,fy+3.4);
      pdf.text(fc,105,fy+6.8,{align:"center"});pdf.text(String(pg),194,fy+6.8,{align:"right"});y+=h}
    pdf.setProperties({title:fc,author:T.name});return pdf.output("blob")}finally{wrap.remove()}}
async function grDocPut(g,sid,blob,filename,titel){const u=await filesFn({action:"gupload",g,filename});
  const r=await fetch(u.signedUrl,{method:"PUT",headers:{apikey:SUPA.key,"x-upsert":"false","Content-Type":"application/pdf"},body:blob});if(!r.ok)throw new Error("Upload fehlgeschlagen ("+r.status+")");
  await rpc("gremium_doc_add",{p_code:S.code,p_g:g,p_sitzung:sid||null,p_titel:titel,p_path:u.path,p_mime:"application/pdf",p_size:blob.size})}

async function grDocUpload(g,sid){const fl=[...($("#gdfile")?.files||[])];if(!fl.length)return toast("Bitte Dateien wählen");let ok=0;
  for(const f of fl){if(f.size>50*1048576){toast(`${f.name}: grösser als 50 MB`);continue}
    try{toast(`Lade ${f.name} …`);const u=await filesFn({action:"gupload",g,filename:f.name});
      const r=await fetch(u.signedUrl,{method:"PUT",headers:{apikey:SUPA.key,"x-upsert":"false","Content-Type":f.type||"application/octet-stream"},body:f});if(!r.ok)throw new Error("Upload fehlgeschlagen ("+r.status+")");
      await rpc("gremium_doc_add",{p_code:S.code,p_g:g,p_sitzung:sid||null,p_titel:f.name.replace(/\.[^.]+$/,""),p_path:u.path,p_mime:f.type||null,p_size:f.size});ok++}catch(e){toast(e.message)}}
  await grLoad(g,true);render();if(ok)toast(`${ok} Dokument${ok>1?"e":""} hochgeladen`)}
